name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vulnscan
          POSTGRES_PASSWORD: vulnscan
          POSTGRES_DB: vulnscan_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nmap

    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run linting
      run: |
        cd backend
        pip install black flake8 mypy bandit
        black --check .
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        bandit -r backend -ll

    - name: Run tests
      env:
        POSTGRES_HOST: localhost
        POSTGRES_USER: vulnscan
        POSTGRES_PASSWORD: vulnscan
        POSTGRES_DB: vulnscan_test
        REDIS_HOST: localhost
        VAULT_ADDR: http://localhost:8200
        VAULT_TOKEN: test
      run: |
        cd backend
        pytest tests/ -v --cov=backend --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: backend

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Run linting
      run: |
        cd frontend
        npm run lint || true

    - name: Run tests
      run: |
        cd frontend
        npm test -- --coverage --watchAll=false

    - name: Build
      run: |
        cd frontend
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build API image
      run: |
        docker build -f infra/docker/Dockerfile.api -t vulnscan-api:test .

    - name: Build Worker image
      run: |
        docker build -f infra/docker/Dockerfile.worker -t vulnscan-worker:test .

    - name: Build Frontend image
      run: |
        docker build -f infra/docker/Dockerfile.frontend -t vulnscan-frontend:test ./frontend

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
